<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 280" width="1420" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .out { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
      .step { font-size: 12px; font-weight: 700; fill: #6366f1; letter-spacing: 1px; }
      .title { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .detail { font-size: 13px; fill: #475569; }
      .link { stroke: #64748b; stroke-width: 1.6; fill: none; }
    </style>
  </defs>

  <rect x="0.75" y="0.75" width="1418.5" height="278.5" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 01 -->
  <rect class="box" x="30" y="60" width="190" height="160" rx="12"/>
  <text class="step" x="48" y="88">01</text>
  <text class="title" x="48" y="114">EiLA videos</text>
  <text class="detail" x="48" y="142">YouTube clips</text>
  <text class="detail" x="48" y="162">person bounding boxes</text>
  <text class="detail" x="48" y="182">annotator emotion votes</text>

  <line class="link" x1="222" y1="140" x2="248" y2="140" marker-end="url(#arrow)"/>

  <!-- 02 -->
  <rect class="box" x="250" y="60" width="190" height="160" rx="12"/>
  <text class="step" x="268" y="88">02</text>
  <text class="title" x="268" y="114">Frame extraction</text>
  <text class="detail" x="268" y="142">crop the annotated</text>
  <text class="detail" x="268" y="162">person in each frame</text>
  <text class="detail" x="268" y="182">(OpenCV)</text>

  <line class="link" x1="442" y1="140" x2="468" y2="140" marker-end="url(#arrow)"/>

  <!-- 03 -->
  <rect class="box" x="470" y="60" width="190" height="160" rx="12"/>
  <text class="step" x="488" y="88">03</text>
  <text class="title" x="488" y="114">PoseLandmarker</text>
  <text class="detail" x="488" y="142">33 landmarks (x, y, z)</text>
  <text class="detail" x="488" y="162">visibility ≥ 0.3</text>
  <text class="detail" x="488" y="182">hip-aligned in 3D</text>

  <line class="link" x1="662" y1="140" x2="688" y2="140" marker-end="url(#arrow)"/>

  <!-- 04 -->
  <rect class="box" x="690" y="60" width="190" height="160" rx="12"/>
  <text class="step" x="708" y="88">04</text>
  <text class="title" x="708" y="114">Clean &amp; segment</text>
  <text class="detail" x="708" y="142">upper body, 25 joints</text>
  <text class="detail" x="708" y="162">cubic-spline gap filling</text>
  <text class="detail" x="708" y="182">326 clips → 10 frames</text>

  <line class="link" x1="882" y1="140" x2="908" y2="140" marker-end="url(#arrow)"/>

  <!-- 05 -->
  <rect class="box" x="910" y="60" width="190" height="160" rx="12"/>
  <text class="step" x="928" y="88">05</text>
  <text class="title" x="928" y="114">Distance features</text>
  <text class="detail" x="928" y="142">7 anchors × 24 joints</text>
  <text class="detail" x="928" y="162">× 10 frames</text>
  <text class="detail" x="928" y="182">= 1,680-d vector</text>

  <!-- fork -->
  <path class="link" d="M1102,140 H1116 C1132,140 1132,85 1148,85 H1158" marker-end="url(#arrow)"/>
  <path class="link" d="M1116,140 C1132,140 1132,205 1148,205 H1158"  marker-end="url(#arrow)"/>

  <!-- 06a -->
  <rect class="out" x="1160" y="30" width="230" height="110" rx="12"/>
  <text class="step" x="1178" y="56">UNSUPERVISED</text>
  <text class="title" x="1178" y="80">Hierarchical clustering</text>
  <text class="detail" x="1178" y="104">7 basic emotions</text>
  <text class="detail" x="1178" y="124">ward · average · complete</text>

  <!-- 06b -->
  <rect class="out" x="1160" y="150" width="230" height="110" rx="12"/>
  <text class="step" x="1178" y="176">SUPERVISED</text>
  <text class="title" x="1178" y="200">Classification</text>
  <text class="detail" x="1178" y="224">Neutral · Happy · Anger</text>
  <text class="detail" x="1178" y="244">SMOTE → SVM · RF · MLP</text>
</svg>
